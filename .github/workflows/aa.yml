name: Test and package AA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Atlas and AA regressions with disposable databases
        if: runner.os != 'Windows'
        run: python -X utf8 tests/run_all.py
      - name: Atlas and AA Python regressions on Windows
        if: runner.os == 'Windows'
        run: python -X utf8 tests/run_all.py --python-only
      - name: Axis regressions
        run: python -m unittest discover -s axis/tests -v

  bundle:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: aa-windows-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: aa-windows
      LLAMA_TAG: b11815
    steps:
      - uses: actions/checkout@v4
      - name: Download the pinned llama.cpp Windows runtimes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/ggml-org/llama.cpp/releases/tags/$LLAMA_TAG" > llama-release.json
          for kind in cpu vulkan; do
            url=$(jq -r --arg k "$kind" '.assets[] | select(.name | test("bin-win-" + $k + "-x64\\.zip$")) | .browser_download_url' llama-release.json | head -n 1)
            test -n "$url"
            curl --fail --location --retry 3 --silent --show-error "$url" -o "$kind.zip"
            mkdir -p "runtimes/llama-$kind"
            unzip -q "$kind.zip" -d "runtimes/llama-$kind"
          done
      - name: Assemble and verify the Windows download
        run: python tools/build_aa_bundle.py --llama-dir runtimes
      - name: Publish the private AA release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AA for Windows" --notes-file docs/RELEASE-NOTES.md --latest=false
          fi
          gh release upload "$TAG" aa-windows.zip aa-windows.zip.sha256 --clobber
          gh release edit "$TAG" --title "AA for Windows" --notes-file docs/RELEASE-NOTES.md
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
