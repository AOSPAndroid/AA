name: Test and package AA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Rebuild and check committed UI and vendor assets
        run: |
          npm run vendor:sync
          npm run build:ui
          git diff --exit-code -- frontend/assets
      - run: npm run format:check
      - run: python tools/run_checks.py
      - run: npm audit --audit-level=high
      - name: Atlas and AA regressions with disposable databases
        if: runner.os != 'Windows'
        run: python -X utf8 tests/run_all.py
      - name: Atlas and AA Python regressions on Windows
        if: runner.os == 'Windows'
        run: python -X utf8 tests/run_all.py --python-only
      - name: Axis regressions
        run: python -m unittest discover -s axis/tests -v

  bundle:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: aa-windows-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned Windows runtimes
        run: python tools/fetch_llama_runtimes.py --output runtimes
      - name: Assemble and verify the Windows download
        run: python tools/build_aa_bundle.py --llama-dir runtimes
      - name: Publish an immutable source-identified AA release
        shell: bash
        run: |
          set -euo pipefail
          TAG="aa-${GITHUB_SHA}"
          if gh release view "$TAG" --json isDraft > release-status.json 2>/dev/null; then
            if ! jq -e '.isDraft' release-status.json > /dev/null; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
              gh release view "$TAG" --json assets --jq '.assets[].name' > release-assets.txt
              grep -Fxq aa-windows.zip release-assets.txt
              grep -Fxq aa-windows.zip.sha256 release-assets.txt
              echo "Complete immutable release $TAG already exists; assets retained."
              exit 0
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "AA ${GITHUB_SHA:0:8}" --notes-file docs/RELEASE-NOTES.md
          fi
          # Only drafts are mutable. Publish after both uploads are complete.
          gh release upload "$TAG" aa-windows.zip aa-windows.zip.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest
